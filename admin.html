<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexCapital - Admin Control Center</title>
    <style>
        :root {
            --bg-main: #060911;
            --bg-card: #0f172a;
            --border-color: #1e293b;
            --accent-amber: #f59e0b;
            --text-main: #f9fafb;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-amber);
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }
        nav a:hover {
            color: var(--text-main);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        th {
            color: var(--text-muted);
            font-weight: 600;
        }
        select.status-select {
            background: #1e293b;
            color: #f9fafb;
            border: 1px solid #475569;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
        }
        .action-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .action-btn:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">ApexCapital // Admin Control Center</div>
        <nav>
            <a href="index.html">View Client Portal</a>
        </nav>
    </header>

    <h3>Incoming Loan Applications</h3>
    <p style="font-size: 13px; color: var(--text-muted);">Manage client submissions below. Changing status values updates client tracking instantly.</p>

    <table>
        <thead>
            <tr>
                <th>Applicant Name</th>
                <th>Email</th>
                <th>Amount</th>
                <th>Fee Required</th>
                <th>Current Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="adminTableBody">
            <!-- Dynamic Applications populate here -->
        </tbody>
    </table>
</div>

<script>
    function loadAdminApplications() {
        const applications = JSON.parse(localStorage.getItem('apexApplications')) || [];
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = '';

        if (applications.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #94a3b8; padding: 20px;">No applications submitted yet.</td></tr>`;
            return;
        }

        applications.forEach((app, index) => {
            tbody.innerHTML += `
                <tr>
                    <td>${app.name}</td>
                    <td>${app.email}</td>
                    <td>$${app.amount}</td>
                    <td>$${app.fee}</td>
                    <td>
                        <select class="status-select" onchange="updateStatus(${index}, this.value)">
                            <option value="Under Review - Verification Pending" ${app.status.includes('Under Review') ? 'selected' : ''}>Under Review</option>
                            <option value="Fee Received - Underwriting Processing" ${app.status.includes('Fee Received') ? 'selected' : ''}>Fee Received</option>
                            <option value="Approved & Disbursed" ${app.status.includes('Approved') ? 'selected' : ''}>Approved & Disbursed</option>
                        </select>
                    </td>
                    <td><button class="action-btn" onclick="deleteApp(${index})">Delete</button></td>
                </tr>
            `;
        });
    }

    function updateStatus(index, newStatus) {
        let applications = JSON.parse(localStorage.getItem('apexApplications')) || [];
        if (applications[index]) {
            applications[index].status = newStatus;
            localStorage.setItem('apexApplications', JSON.stringify(applications));
            alert("Status updated successfully! The client tracker will now display this update.");
        }
    }

    function deleteApp(index) {
        if (confirm("Are you sure you want to delete this application?")) {
            let applications = JSON.parse(localStorage.getItem('apexApplications')) || [];
            applications.splice(index, 1);
            localStorage.setItem('apexApplications', JSON.stringify(applications));
            loadAdminApplications();
        }
    }

    window.onload = loadAdminApplications;
</script>

</body>
</html>
