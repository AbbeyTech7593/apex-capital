<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Capital - Loan Application Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .notice {
            background-color: #e9f7fe;
            border-left: 4px solid #2196F3;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #0c5460;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Apex Capital Loan Application</h2>
    
    <!-- Notice regarding review time and payment -->
    <div class="notice">
        <strong>Important Notice:</strong> Your loan application will be reviewed within <strong>48 hours</strong> after your payment is successfully completed.
    </div>

    <!-- Replace YOUR_FORM_ID_HERE with your free form endpoint (e.g., from Formspree.io) -->
    <form action="https://formspree.io/f/YOUR_FORM_ID_HERE" method="POST">
        
        <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
        </div>

        <div class="form-group">
            <label for="amount">Loan Amount Requested ($)</label>
            <input type="number" id="amount" name="amount" required placeholder="e.g. 5000">
        </div>

        <div class="form-group">
            <label for="purpose">Purpose of Loan</label>
            <select id="purpose" name="purpose" required>
                <option value="">Select a purpose</option>
                <option value="Business">Business Expansion</option>
                <option value="Personal">Personal Use</option>
                <option value="Emergency">Emergency</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <button type="submit">Submit Loan Application</button>
    </form>
</div>

</body>
</html>
</html>
