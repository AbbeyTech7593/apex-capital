<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Capital - Loan Application Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            text-align: center;
        }
        .notice {
            background-color: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #0d47a1;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #0056b3;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #004085;
        }

        /* Floating Support Chat Styles */
        .chat-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 50%
            width: 60px;
            height: 60px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .chat-container {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 320px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }
        .chat-header {
            background-color: #0056b3;
            color: white;
            padding: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-body {
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            background: #f9f9f9;
            font-size: 14px;
        }
        .chat-footer {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background: white;
        }
        .chat-footer input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .chat-footer button {
            width: auto;
            padding: 8px 12px;
            margin-left: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Apex Capital Loan Application</h2>
    <div class="notice">
        <strong>Important Notice:</strong> Your loan application will be reviewed within <strong>48 hours</strong> after verification is complete.
    </div>

    <form>
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
            <label>Email Address *</label>
            <input type="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" placeholder="Enter your phone number" required>
        </div>
        <div class="form-group">
            <label>Social Security Number (SSN) *</label>
            <input type="password" placeholder="XXX-XX-XXXX" maxlength="11" required>
        </div>
        <div class="form-group">
            <label>Upload Government ID / Driver's License *</label>
            <input type="file" accept=".pdf, .jpg, .jpeg, .png" required>
        </div>
        <div class="form-group">
            <label>Loan Amount Requested ($) *</label>
            <input type="number" placeholder="e.g. 5000" required>
        </div>
        <div class="form-group">
            <label>Purpose of Loan *</label>
            <select required>
                <option value="">Select a purpose</option>
                <option value="business">Business Expansion</option>
                <option value="personal">Personal Use</option>
                <option value="emergency">Emergency</option>
                <option value="other">Other</option>
            </select>
        </div>
        <button type="submit">Submit Loan Application</button>
    </form>
</div>

<!-- Support Chat Widget -->
<button class="chat-toggle-btn" onclick="toggleChat()">💬</button>

<div class="chat-container" id="chatContainer">
    <div class="chat-header">
        Apex Support Chat <span style="cursor:pointer;" onclick="toggleChat()">✕</span>
    </div>
    <div class="chat-body" id="chatBody">
        <p><strong>Support:</strong> Hello! Welcome to Apex Capital. How can we help you with your loan application today?</p>
    </div>
    <div class="chat-footer">
        <input type="text" id="chatInput" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    function toggleChat() {
        const chat = document.getElementById('chatContainer');
        chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
    }

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const body = document.getElementById('chatBody');
        if (input.value.trim() !== '') {
            // User message
            body.innerHTML += `<p><strong>You:</strong> ${input.value}</p>`;
            const userMsg = input.value;
            input.value = '';
            body.scrollTop = body.scrollHeight;

            // Simulated auto-reply / agent response hook
            setTimeout(() => {
                body.innerHTML += `<p><strong>Support:</strong> Thanks for reaching out. An agent will respond to your query regarding "${userMsg}" shortly.</p>`;
                body.scrollTop = body.scrollHeight;
            }, 1000);
        }
    }
</script>

</body>
</html>
